    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fff;
            color: #000;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
        }
        .noise {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            opacity: .03;
            background-image: url("/media/noise.svg");
        }

        .mask-text {
            overflow: hidden;
            display: block;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff;
        }
        ::-webkit-scrollbar-thumb {
            background: #eee;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #703FEC;
        }
        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
            overflow: hidden;
        }
        /* The nav steps aside while the immersive section has the screen */
        [data-site-nav] {
            transition: transform .6s cubic-bezier(.16,1,.3,1), opacity .4s ease;
        }
        html[data-immersive] [data-site-nav], html[data-footer] [data-site-nav] {
            transform: translateY(-110%) !important;
            opacity: 0;
            pointer-events: none;
        }
        ::selection {
            background: #703FEC;
            color: white;
        }
        /* First home visit: cover the pre-rendered page until the intro loader mounts */
        html.intro-pending, html.intro-pending body { background: #050505; overflow: hidden; }
        html.intro-pending body::before { content: ''; position: fixed; inset: 0; z-index: 9998; background: #050505; }
        html.intro-pending body::after {
            content: ''; position: fixed; left: 50%; top: 50%; z-index: 9998;
            width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #fff;
        }
    </style>
    <script>
        // Same rule as App: the intro plays once per visit, on the home page only
        (function () {
            if (location.pathname !== '/' && location.pathname !== '/index.html') return;
            var seen = false;
            try { seen = !!sessionStorage.getItem('natwic:intro'); } catch (e) {}
            if (seen) return;
            var html = document.documentElement;
            html.classList.add('intro-pending');
            // Never leave the page covered if the app fails to start
            setTimeout(function () { html.classList.remove('intro-pending'); }, 8000);
        })();
    </script>
